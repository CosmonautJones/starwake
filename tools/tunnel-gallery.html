<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starwake Tunnel Gallery</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; color: #cfd8e6; }
    canvas { display: block; }
    #panel { position: fixed; left: 10px; top: 10px; background: rgba(8, 12, 20, 0.72); border: 1px solid rgba(160, 190, 230, 0.18); border-radius: 6px; padding: 8px 10px; max-width: 360px; }
    #panel.hidden { display: none; }
    #panel b { color: #fff; }
    #panel button { background: #142033; color: #d8e6ff; border: 1px solid #2a3f60; border-radius: 4px; padding: 3px 7px; margin: 2px 1px; cursor: pointer; font: inherit; }
    #panel button:hover { background: #1d2f4a; }
    #stats { margin-top: 6px; opacity: 0.8; white-space: pre; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "../vendor/three/three.module.js",
        "three/addons/": "../vendor/three/addons/"
    } }
  </script>
</head>
<body>
  <div id="panel">
    <div><b>Starwake tunnel gallery</b></div>
    <div>1–6 course · F fly · O overview · ←/→ steer to wall · X scrape · H hide · Space pause</div>
    <div id="courses"></div>
    <div>
      <button data-act="fly">Fly</button>
      <button data-act="overview">Overview</button>
      <button data-act="scrape">Scrape</button>
    </div>
    <div id="stats"></div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { SpaceSky } from '../js/space/sky.js';
    import { RockBelt } from '../js/space/rocks.js';
    import { buildProp, disposeProp, updateProps } from '../js/space/props.js';
    import { Tunnel } from '../js/space/tunnel.js';
    import { courseDefById, raceCourses } from '../js/flight/courseDefs.js';
    import { Course } from '../js/flight/course.js';
    import { buildDivider } from '../js/space/divider.js';
    // Built-in courses plus today's daily run; ?course= also takes 'daily' or a daily id.
    const COURSES = raceCourses();

    const params = new URLSearchParams(location.search);
    const quality = params.get('quality') || 'high';
    // Fallback tunnels for course defs that predate def.tunnel.
    const INJECT = {
      corona: { radius: 70 },
      shatter: { radius: 60, pinches: [{ at: 0.62, len: 0.05, radius: 42 }] },
      veil: { radius: 50, pinches: [{ at: 0.3, len: 0.04, radius: 34 }, { at: 0.75, len: 0.05, radius: 36 }] },
    };

    // ------------------------------------------------------------ renderer + post
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.5, 20000);
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.5, 0.82);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    // ------------------------------------------------------------ course content
    let def = null, course = null, sky = null, tunnel = null, belts = [], props = [], gates = null, dividers = [], extraShips = [];
    const gateGeo = new THREE.TorusGeometry(1, 0.06, 6, 48);
    const gateMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#ffe9a8') });
    const ship = new THREE.Mesh(new THREE.ConeGeometry(1.4, 5, 10).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#c9d4e4', metalness: 0.6, roughness: 0.35, emissive: '#1a2a40' }));
    const flame = new THREE.Mesh(new THREE.SphereGeometry(0.8, 10, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color('#9fe8ff').multiplyScalar(3) }));
    flame.position.z = 2.8; ship.add(flame);
    scene.add(ship);

    function rngf(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    function clearCourse() {
      tunnel?.dispose(); tunnel = null;
      sky?.dispose(); sky = null;
      for (const b of belts) b.dispose?.();
      belts = [];
      for (const p of props) { p.object.removeFromParent(); disposeProp(p); }
      props = [];
      if (gates) { gates.removeFromParent(); gates.dispose(); gates = null; }
      for (const d of dividers) d.dispose();
      dividers = [];
      for (const m of extraShips) m.removeFromParent();
      extraShips = [];
    }
    function addProp(type, pos, scale, seed, quat) {
      const p = buildProp(type, { seed });
      p.object.position.copy(pos); p.object.scale.setScalar(scale);
      if (quat) p.object.quaternion.copy(quat); else p.object.rotation.set(seed * 0.7, seed * 1.3, seed * 0.4);
      scene.add(p.object); props.push(p); return p;
    }

    function setCourse(id) {
      const d = typeof id === 'number' ? COURSES[((id % COURSES.length) + COURSES.length) % COURSES.length] : courseDefById(id);
      clearCourse();
      def = d.tunnel ? d : { ...d, tunnel: INJECT[d.id] || { radius: 60 } };
      course = new Course(def);
      sky = new SpaceSky(renderer, scene, def.theme, { quality: 'high' });
      tunnel = new Tunnel(scene, course, { color: def.theme.accent, quality });
      tunnel.pixelHeight = renderer.domElement.height;
      for (const b of def.belts || []) belts.push(new RockBelt(scene, { ...b, seed: 5 }));
      // obstacles inside the tunnel and big set pieces outside, to judge readability
      const r = rngf(17);
      const kinds = def.id === 'veil' ? ['ice', 'ice', 'crystal', 'cargo'] : ['asteroid', 'asteroid', 'cargo', 'crystal'];
      for (let i = 0; i < 70; i++) {
        const u = 0.02 + r() * 0.96;
        const f = course.frameAt(u);
        const R = course.tunnelRadiusAt(u) * 0.75 * Math.sqrt(r());
        const a = r() * Math.PI * 2;
        const pos = f.pos.clone().addScaledVector(f.R, Math.cos(a) * R).addScaledVector(f.U, Math.sin(a) * R);
        const kind = kinds[i % kinds.length];
        addProp(kind, pos, kind === 'asteroid' || kind === 'ice' ? 3 + r() * 6 : 1.2, 3 + i);
      }
      for (const ft of def.features || []) {
        if (ft.type !== 'station' && ft.type !== 'wreck' && ft.type !== 'landmark') continue;
        const f = course.frameAt(ft.at);
        if (ft.type === 'station') {
          const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(f.R, f.U, f.T.clone().negate()));
          addProp('station', f.pos, 1, 1, q);
        } else {
          const pos = f.pos.clone().addScaledVector(f.R, (ft.side || 1) * (ft.offset || 180));
          addProp(ft.type === 'wreck' ? 'wreck' : ft.prop, pos, ft.scale || 1, 4);
        }
      }
      // split-lane dividers, as the game draws them
      for (const sp of course.splits) {
        const f = course.frameAt(sp.at);
        const pos = f.pos.clone().addScaledVector(sp.axis === 'up' ? f.U : f.R, sp.side * sp.offset);
        const d = buildDivider({ pos, split: sp }, course, { accent: def.theme.accent, quality });
        d.object.position.copy(pos);
        scene.add(d.object); dividers.push(d);
      }
      // boost gates (optional, off-centre)
      gates = new THREE.InstancedMesh(gateGeo, gateMat, Math.max(1, course.rings.length));
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3();
      course.rings.forEach((g, i) => {
        q.setFromUnitVectors(new THREE.Vector3(0, 0, 1), g.normal);
        m.compose(g.pos, q, s.setScalar(g.radius)); gates.setMatrixAt(i, m);
      });
      gates.count = course.rings.length;
      scene.add(gates);
      mode = 'fly';
      fly(state.u);
      return def.id;
    }

    // ------------------------------------------------------------ cameras
    const state = { u: 0.97, lat: 0, up: 0, speed: 180, shipOn: true };
    let mode = 'fly';
    const _f = { pos: new THREE.Vector3(), T: new THREE.Vector3(), R: new THREE.Vector3(), U: new THREE.Vector3() };
    const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _c = new THREE.Vector3();
    const shipPos = new THREE.Vector3();
    function frame(u) {
      const f = course.frameAt(((u % 1) + 1) % 1);
      _f.pos.copy(f.pos); _f.T.copy(f.T); _f.R.copy(f.R); _f.U.copy(f.U);
      return _f;
    }
    function placeChase() {
      const L = course.length;
      const f = frame(state.u);
      // ship 14 ahead of the camera; lat/up offsets push it toward the wall (fraction of radius)
      const fs = frame(state.u + 14 / L);
      const R = course.tunnelRadiusAt(state.u + 14 / L);
      shipPos.copy(fs.pos).addScaledVector(fs.R, state.lat * R).addScaledVector(fs.U, state.up * R);
      const fc = frame(state.u);
      const Rc = course.tunnelRadiusAt(state.u);
      camera.position.copy(fc.pos).addScaledVector(fc.R, state.lat * Rc * 0.9).addScaledVector(fc.U, state.up * Rc * 0.9 + 4);
      const fa = frame(state.u + 70 / L);
      _a.copy(fa.pos).addScaledVector(fa.R, state.lat * R * 0.6).addScaledVector(fa.U, state.up * R * 0.6 + 2);
      camera.up.copy(fc.U);
      camera.lookAt(_a);
      ship.visible = state.shipOn;
      ship.position.copy(shipPos);
      ship.lookAt(_b.copy(shipPos).add(fs.T));
      ship.up.copy(fs.U);
    }
    function fly(u = state.u, { lat = 0, up = 0, ship = true, fov = 70 } = {}) {
      mode = 'fly';
      state.u = ((u % 1) + 1) % 1; state.lat = lat; state.up = up; state.shipOn = ship;
      camera.fov = fov; camera.updateProjectionMatrix();
      placeChase();
      return state.u;
    }
    function overview({ az = 0.6, el = 0.55, dist = 1.15, fov = 50 } = {}) {
      mode = 'overview';
      const box = new THREE.Box3().setFromPoints(course.samples);
      const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length();
      const dir = new THREE.Vector3(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
      camera.fov = fov; camera.updateProjectionMatrix();
      camera.up.set(0, 1, 0);
      camera.position.copy(c).addScaledVector(dir, size * dist);
      camera.lookAt(c);
      ship.visible = false;
    }
    function scrape(intensity = 1) {
      // contact point: on the wall nearest the ship (toward its lateral offset, else below it)
      const u = course.nearestU(shipPos).u;
      const f = frame(u);
      _c.subVectors(shipPos, f.pos);
      _c.addScaledVector(f.T, -_c.dot(f.T));
      if (_c.lengthSq() < 1) _c.copy(f.U).negate();
      _c.normalize();
      const p = f.pos.clone().addScaledVector(_c, course.tunnelRadiusAt(u));
      tunnel.scrape(p, intensity);
      return p.toArray().map((x) => +x.toFixed(1));
    }

    // ------------------------------------------------------------ loop
    let paused = false, last = performance.now();
    function step(dt, render = true) {
      if (mode === 'fly') {
        state.u = (state.u + (state.speed * dt) / course.length) % 1;
        placeChase();
      }
      belts.forEach((b) => b.update?.(dt));
      updateProps(dt);
      tunnel.update(dt, camera, { shipPos: mode === 'fly' && state.shipOn ? shipPos : null, speed: mode === 'fly' ? state.speed : 0 });
      sky.update(camera, dt);
      if (render) composer.render(dt);
    }
    function loop() {
      requestAnimationFrame(loop);
      const now = performance.now();
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!paused) step(dt);
    }

    // ------------------------------------------------------------ UI
    const coursesEl = document.getElementById('courses');
    COURSES.forEach((c, i) => { const b = document.createElement('button'); b.textContent = c.name; b.onclick = () => setCourse(i); coursesEl.appendChild(b); });
    document.querySelector('[data-act=fly]').onclick = () => fly(state.u);
    document.querySelector('[data-act=overview]').onclick = () => overview();
    document.querySelector('[data-act=scrape]').onclick = () => scrape();
    window.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '9') setCourse(+e.key - 1);
      else if (e.key === 'f' || e.key === 'F') fly(state.u);
      else if (e.key === 'o' || e.key === 'O') overview();
      else if (e.key === 'x' || e.key === 'X') scrape();
      else if (e.key === 'ArrowLeft') state.lat = Math.max(-0.85, state.lat - 0.1);
      else if (e.key === 'ArrowRight') state.lat = Math.min(0.85, state.lat + 0.1);
      else if (e.key === 'h' || e.key === 'H') document.getElementById('panel').classList.toggle('hidden');
      else if (e.key === ' ') paused = !paused;
    });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
      if (tunnel) tunnel.pixelHeight = renderer.domElement.height;
    });
    function info() {
      // count only the tunnel: render it alone into the default target
      renderer.info.autoReset = false; renderer.info.reset();
      const vis = [];
      scene.children.forEach((o) => { vis.push(o.visible); o.visible = o === tunnel.group; });
      const bg = scene.background; scene.background = null;
      renderer.render(scene, camera);
      scene.background = bg;
      scene.children.forEach((o, i) => { o.visible = vis[i]; });
      const r = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, tunnelTris: tunnel.triangles, hoops: tunnel.hoops.length, twist: tunnel.twist };
      renderer.info.autoReset = true;
      return r;
    }
    const statsEl = document.getElementById('stats');
    setInterval(() => { if (!tunnel) return; statsEl.textContent = `${def.name} · ${mode} · u ${state.u.toFixed(3)}\ntunnel tris ${(tunnel.triangles / 1000).toFixed(1)}k · hoops ${tunnel.hoops.length}`; }, 1000);

    /** Park another ship in the tube (e.g. in the other strand of a crossover) for screenshots. */
    function addShip(u, lat = 0, up = 0) {
      const m = ship.clone();
      const f = course.frameAt(((u % 1) + 1) % 1), R = course.tunnelRadiusAt(u);
      m.position.copy(f.pos).addScaledVector(f.R, lat * R).addScaledVector(f.U, up * R);
      m.lookAt(m.position.clone().add(f.T)); m.visible = true;
      scene.add(m); extraShips.push(m);
      return m.position.toArray().map((x) => +x.toFixed(1));
    }
    const cp = params.get('course');
    setCourse(cp == null ? 0 : /^\d+$/.test(cp) ? +cp : cp);
    window.gallery = {
      THREE, scene, camera, renderer, composer, state,
      get tunnel() { return tunnel; }, get course() { return course; }, get def() { return def; },
      setCourse, fly, overview, scrape, info, addShip,
      pause() { paused = true; }, resume() { paused = false; last = performance.now(); },
      step(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) step(dt, i === n - 1); },
      hidePanel(h = true) { document.getElementById('panel').classList.toggle('hidden', h); },
      ready: true,
    };
    if (!params.has('manual')) loop();
  </script>
</body>
</html>
