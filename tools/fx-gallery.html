<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starwake FX Gallery</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; color: #cfd8e6; }
    canvas { display: block; }
    .panel { position: fixed; background: rgba(8, 12, 20, 0.78); border: 1px solid rgba(160, 190, 230, 0.18); border-radius: 6px; padding: 8px 10px; }
    #panel { left: 10px; top: 10px; max-width: 380px; }
    #audio { right: 10px; top: 10px; width: 360px; max-height: calc(100% - 40px); overflow: auto; display: none; }
    .hidden { display: none !important; }
    .panel b { color: #fff; }
    .panel button { background: #142033; color: #d8e6ff; border: 1px solid #2a3f60; border-radius: 4px; padding: 3px 7px; margin: 2px 1px; cursor: pointer; font: inherit; }
    .panel button:hover { background: #1d2f4a; }
    .panel button.on { background: #2a4670; border-color: #5d8fd0; }
    .panel label { display: flex; gap: 6px; align-items: center; margin: 2px 0; }
    .panel input[type=range] { flex: 1; }
    #stats, #atest { margin-top: 6px; opacity: 0.85; white-space: pre; font: 11px/1.35 ui-monospace, monospace; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "../vendor/three/three.module.js",
        "three/addons/": "../vendor/three/addons/"
    } }
  </script>
</head>
<body>
  <div id="panel" class="panel">
    <div><b>Starwake FX gallery</b> — destruction + speed</div>
    <div id="scenes"></div>
    <div id="levels"></div>
    <div>
      <button data-act="break">Break / trigger (B)</button>
      <button data-act="near">Near miss (N)</button>
      <button data-act="reduce">Reduce motion</button>
      <button data-act="audio">Audio panel (A)</button>
    </div>
    <div id="stats"></div>
  </div>
  <div id="audio" class="panel">
    <div><b>Audio test</b> — click once to unlock audio</div>
    <div id="sounds"></div>
    <div style="margin-top:6px"><b>Engine</b> <button id="engOn">Engine on/off</button></div>
    <label>speed <input id="eSpeed" type="range" min="0" max="1.4" step="0.01" value="0.8"></label>
    <label>throttle <input id="eThr" type="range" min="0" max="1" step="0.01" value="1"></label>
    <label>wall <input id="eWall" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label>grind <input id="eGrind" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><input id="eBoost" type="checkbox"> boost</label>
    <label><input id="eSS" type="checkbox"> supersonic</label>
    <div style="margin-top:6px"><button id="offline">Offline level check</button></div>
    <div id="atest"></div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { SpaceSky } from '../js/space/sky.js';
    import { Tunnel } from '../js/space/tunnel.js';
    import { makeRockGeometry, rockMaterial } from '../js/space/rocks.js';
    import { buildProp, disposeProp, updateProps } from '../js/space/props.js';
    import { Explosions } from '../js/space/fx.js';
    import { Debris, tunnelBounds } from '../js/space/debris.js';
    import { SpeedFX, createSpeedPass } from '../js/space/speedfx.js';
    import { buildCraft } from '../js/craft/craftMesh.js';
    import { PRESETS } from '../js/craft/parts.js';
    import { Course } from '../js/flight/course.js';
    import { COURSES } from '../js/flight/courseDefs.js';
    import { AudioEngine } from '../js/core/audio.js';

    const params = new URLSearchParams(location.search);
    const quality = params.get('quality') || 'high';
    const manual = params.has('manual');     // no rAF loop: drive with window.fx.run()

    // ------------------------------------------------------------ renderer + post (like the game)
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(manual ? 1 : Math.min(window.devicePixelRatio, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.5, 20000);
    let scene = new THREE.Scene();
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    const speedPass = createSpeedPass();
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), quality === 'high' ? 0.7 : 0.6, 0.5, 0.82);
    composer.addPass(renderPass);
    composer.addPass(speedPass);          // <- insertion point: after RenderPass, before bloom
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    // ------------------------------------------------------------ scene state
    const S = {
      name: params.get('scene') || 'ship', level: params.get('level') || 'super', preset: +(params.get('preset') || 0),
      t: 0, reduce: params.has('reduce'), broken: false, nearMiss: 0,
    };
    let sky = null, tunnel = null, course = null, debris = null, speed = null, explosions = null, bounds = null;
    let craft = null, rivals = [], items = [], props = [], flight = null, wreckCam = null;
    const _v = new THREE.Vector3(), _v2 = new THREE.Vector3(), _q = new THREE.Quaternion(), _m = new THREE.Matrix4();

    function clear() {
      debris?.dispose(); speed?.dispose(); explosions?.dispose(); tunnel?.dispose(); sky?.dispose();
      for (const c of [craft, ...rivals]) if (c) { c.root.removeFromParent(); c.dispose(); }
      for (const p of props) { p.object.removeFromParent(); disposeProp(p); }
      for (const it of items) it.obj.removeFromParent();
      debris = speed = explosions = tunnel = sky = craft = course = bounds = null;
      rivals = []; items = []; props = []; flight = null; wreckCam = null;
      scene = new THREE.Scene();
      renderPass.scene = scene;
    }

    function setup(name = S.name, opts = {}) {
      clear();
      Object.assign(S, { name, t: 0, broken: false, nearMiss: 0 }, opts);
      const def = COURSES[name === 'rocks' ? 1 : 0];
      sky = new SpaceSky(renderer, scene, def.theme, { quality: 'high' });
      debris = new Debris(scene, { max: quality === 'low' ? 100 : 160, quality });
      explosions = new Explosions(scene, { max: 12 });
      speed = new SpeedFX(scene, camera, { quality, reduceMotion: S.reduce });
      speed.setSize(window.innerWidth, window.innerHeight);
      speed.attachPass(speedPass);
      speedPass.enabled = false;
      speedPass.uniforms.uBoomT.value = -1;
      camera.fov = 70; camera.updateProjectionMatrix();
      if (name === 'ship') setupShip();
      else if (name === 'rocks') setupRocks();
      else if (name === 'audio') { setupShip(); document.getElementById('audio').style.display = 'block'; }
      else setupFlight(name);
      return name;
    }

    // ---- ship breaking apart, open space
    function setupShip() {
      craft = buildCraft(PRESETS[S.preset % PRESETS.length], { lod: 'high', underglow: false });
      scene.add(craft.root);
      craft.root.rotation.set(0.15, 0.6, 0.12);
      debris.prepare(craft);
      S.shipVel = new THREE.Vector3(0, 0, params.has('still') ? 0 : -30).applyQuaternion(craft.root.quaternion);
      camera.position.set(9, 4, 15);
      camera.lookAt(0, 0, -2);
    }
    function breakShip() {
      if (!craft || S.broken) return;
      S.broken = true;
      craft.root.updateMatrixWorld(true);
      debris.shipBreak(craft, { velocity: S.shipVel, intensity: S.name === 'ship' ? 1.1 : 1.3 });
      if (!params.has('noexp')) explosions.spawn({ position: craft.root.position, size: 1.3, color: new THREE.Color('#ffb36b').lerp(craft.glowColor, 0.35), velocity: _v.copy(S.shipVel).multiplyScalar(0.3) });
      craft.root.visible = false;
    }

    // ---- rocks, ice, crystal, cargo
    function setupRocks() {
      const kinds = [
        { kind: 'rock', R: 9, pos: [-17, 2, -10] }, { kind: 'ice', R: 7, pos: [2, 6, -18] },
        { kind: 'crystal', R: 5, pos: [14, -2, -6], prop: 'crystal' }, { kind: 'metal', R: 4, pos: [-2, -6, 0], prop: 'cargo' },
      ];
      for (const k of kinds) {
        let obj, tint = null;
        if (k.prop) { const p = buildProp(k.prop, { seed: 3 }); props.push(p); obj = p.object; tint = p.tint || null; obj.scale.setScalar(k.R / (k.prop === 'crystal' ? 6 : 4)); }
        else { obj = new THREE.Mesh(makeRockGeometry(k.kind === 'ice' ? 77 : 31, { detail: 4, roughness: 0.36, craters: k.kind === 'rock', facets: k.kind === 'ice' ? 6 : 2, stretch: [1.2, 0.85, 1], tone: k.kind === 'ice' ? 0.5 : 1 }), rockMaterial(k.kind)); obj.scale.setScalar(k.R); }
        obj.position.set(...k.pos);
        obj.rotation.set(0.4, 0.8, 0.2);
        scene.add(obj);
        items.push({ ...k, obj, tint });
      }
      camera.position.set(0, 6, 38);
      camera.lookAt(0, 0, -6);
    }
    function breakRocks() {
      if (S.broken) return;
      S.broken = true;
      for (const it of items) {
        it.obj.visible = false;
        debris.rockBreak(it.obj.position, it.R, { kind: it.kind, color: it.tint, velocity: _v.set(0, 0, -20) });
      }
    }

    // ---- flying the wormhole: speed levels, wall skim, sonic boom, wreck at speed
    const LEVELS = { cruise: { speedN: 0.8, boost: false, ss: false }, boost: { speedN: 1.15, boost: true, ss: false }, super: { speedN: 1.4, boost: true, ss: true } };
    function setupFlight(name) {
      const def = COURSES[0];
      course = new Course(def);
      tunnel = new Tunnel(scene, course, { color: def.theme.accent, quality });
      tunnel.pixelHeight = renderer.domElement.height;
      bounds = tunnelBounds(course);
      craft = buildCraft(PRESETS[S.preset % PRESETS.length], { lod: 'high', underglow: false });
      scene.add(craft.root);
      debris.prepare(craft);
      // two rivals ahead and some rocks, to judge that the FX keep the track readable
      for (let i = 0; i < 2; i++) { const c = buildCraft(PRESETS[(S.preset + 1 + i) % PRESETS.length], { lod: 'high', underglow: false }); scene.add(c.root); rivals.push(c); }
      const level = name === 'boom' ? 'super' : name === 'wall' ? (S.level === 'cruise' ? 'cruise' : 'boost') : name === 'wreck' ? 'boost' : S.level;
      const L = LEVELS[level] || LEVELS.cruise;
      flight = { u: 0.43, lat: name === 'wall' ? 0.86 : 0.15, up: name === 'wall' ? -0.25 : -0.1, ...L, speed: 130 * L.speedN, vel: new THREE.Vector3(), pos: new THREE.Vector3(), quat: new THREE.Quaternion(), wallPoint: new THREE.Vector3(), wall: 0, ssAt: name === 'boom' ? 0.55 : 0 };
      if (name === 'boom') flight.ss = false;
      for (let i = 0; i < 6; i++) {
        const u = flight.u + (120 + i * 70) / course.length;
        const f = course.frameAt(u), R = course.tunnelRadiusAt(u);
        const a = i * 2.1 + 0.5;
        const obj = new THREE.Mesh(makeRockGeometry(50 + i, { detail: 3, roughness: 0.36 }), rockMaterial('rock'));
        obj.scale.setScalar(3 + (i % 3) * 2);
        obj.position.copy(f.pos).addScaledVector(f.R, Math.cos(a) * R * 0.55).addScaledVector(f.U, Math.sin(a) * R * 0.55);
        scene.add(obj); items.push({ obj, kind: 'rock', R: obj.scale.x });
      }
      placeFlight(0);
    }
    function frameOf(u, lat, up, outPos, outQuat) {
      const f = course.frameAt(((u % 1) + 1) % 1), R = course.tunnelRadiusAt(u);
      outPos.copy(f.pos).addScaledVector(f.R, lat * R).addScaledVector(f.U, up * R);
      _m.makeBasis(f.R, f.U, f.T.clone().negate());
      outQuat.setFromRotationMatrix(_m);
      return { f, R };
    }
    function placeFlight(dt) {
      const F = flight;
      F.u = (F.u + (F.speed * dt) / course.length) % 1;
      const { f, R } = frameOf(F.u, F.lat, F.up, F.pos, F.quat);
      F.vel.copy(f.T).multiplyScalar(F.speed);
      // wall contact point straight out from the ship
      _v.copy(f.R).multiplyScalar(F.lat).addScaledVector(f.U, F.up);
      const off = _v.length();
      F.wall = Math.min(1, off + 2.2 / R);
      F.wallNormal = (F.wallNormal || new THREE.Vector3()).copy(_v).normalize().negate();
      F.wallPoint.copy(f.pos).addScaledVector(_v.normalize(), R);
      if (!S.broken || S.name !== 'wreck') {
        craft.root.position.copy(F.pos);
        craft.root.quaternion.copy(F.quat).multiply(_q.setFromAxisAngle(_v2.set(0, 0, 1), -F.lat * 0.5));
        craft.setThrust(1, F.boost ? 1 : 0, S.t, 0.45);
      }
      rivals.forEach((c, i) => {
        const p = new THREE.Vector3(), q = new THREE.Quaternion();
        frameOf(F.u + (38 + i * 26) / course.length, i ? -0.3 : 0.35, i ? 0.2 : -0.15, p, q);
        c.root.position.copy(p); c.root.quaternion.copy(q);
        c.setThrust(1, 1, S.t, 1);
      });
      // chase camera like FlightRace (back 14 + speed, up 4, slight pitch)
      const camAnchor = S.name === 'wreck' && S.broken ? (wreckCam || (wreckCam = { pos: F.pos.clone(), quat: F.quat.clone() })) : null;
      if (camAnchor) camAnchor.pos.addScaledVector(F.vel, dt * 0.55);
      const base = camAnchor ? camAnchor.pos : F.pos, bq = camAnchor ? camAnchor.quat : F.quat;
      const back = 14 + Math.min(F.speedN, 1.3) * 2.5 + (F.boost ? 2.5 : 0);
      camera.position.copy(base).add(_v.set(0, 4 + F.speedN * 0.4, back).applyQuaternion(bq));
      camera.quaternion.copy(bq).multiply(_q.setFromAxisAngle(_v2.set(1, 0, 0), -0.07));
      camera.fov = 70 + 8 * Math.min(F.speedN, 1.3) + (F.boost ? 6 : 0) + (speed ? speed.fovKick : 0);
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();
    }
    function breakFlight() {
      if (S.name === 'boom') { flight.ss = !flight.ss; return; }
      if (S.broken) return;
      S.broken = true;
      craft.root.updateMatrixWorld(true);
      debris.shipBreak(craft, { velocity: flight.vel, intensity: 1.5 });
      explosions.spawn({ position: craft.root.position, size: 1.4, color: new THREE.Color('#ffb36b'), velocity: _v.copy(flight.vel).multiplyScalar(0.3) });
      craft.root.visible = false;
    }

    function trigger() {
      if (S.name === 'ship' || S.name === 'audio') breakShip();
      else if (S.name === 'rocks') breakRocks();
      else breakFlight();
    }

    // ------------------------------------------------------------ step / render
    function step(dt) {
      S.t += dt;
      if (flight) {
        if (S.name === 'boom' && flight.ssAt && S.t >= flight.ssAt && !flight.ss) { flight.ss = true; flight.ssAt = 0; }
        placeFlight(dt);
        tunnel.update(dt, camera, { shipPos: flight.pos, speed: flight.speed });
        const nm = S.nearMiss; S.nearMiss = 0;
        const alive = !(S.broken && S.name === 'wreck');
        speed.update(dt, {
          speedN: alive ? flight.speedN : 0.6, boost: alive && flight.boost, supersonic: alive && flight.ss,
          wall: alive ? flight.wall : 0, wallPoint: alive && S.name === 'wall' ? flight.wallPoint : null, wallNormal: flight.wallNormal,
          nearMiss: nm, velocity: flight.vel, shipPos: flight.pos, shipQuat: flight.quat, craft: alive ? craft : null,
        });
      } else if (craft && !S.broken) {
        craft.root.position.addScaledVector(S.shipVel, dt);
        craft.setThrust(0.8, 0, S.t, 1);
        speed.update(dt, {});
      } else speed.update(dt, {});
      if (craft && S.name === 'ship') {
        // camera drifts with the wreck so the pieces stay framed
        camera.position.addScaledVector(S.shipVel, dt * 0.7);
      }
      debris.update(dt, camera, { bounds });
      explosions.update(dt, camera);
      updateProps(dt);
      sky.update(camera, dt);
    }
    function render() { renderPass.camera = camera; composer.render(); }

    let paused = false, last = performance.now();
    function loop() {
      requestAnimationFrame(loop);
      const now = performance.now();
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!paused) step(dt);
      render();
      if (Math.floor(now / 500) !== Math.floor((now - dt * 1000) / 500)) showStats();
    }
    function stats() {
      renderer.info.autoReset = false; renderer.info.reset();
      render();
      const r = { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, debris: debris.stats(), speed: speed.stats() };
      renderer.info.autoReset = true;
      return r;
    }
    function showStats() {
      const d = debris.stats(), s = speed.stats();
      document.getElementById('stats').textContent =
        `scene ${S.name}  t ${S.t.toFixed(2)}s  level ${flight ? (flight.ss ? 'super' : flight.boost ? 'boost' : 'cruise') : '-'}\n` +
        `debris: ${d.calls} calls  ${d.tris} tris  ships ${d.ships}  chunks ${d.chunks}  particles ${d.particles}\n` +
        `speed:  ${s.calls} calls  ${s.tris} tris  pass ${s.passOn ? 'on' : 'off'}  fovKick ${speed.fovKick.toFixed(1)}`;
    }

    // deterministic driver for headless screenshots
    window.fx = {
      setup, trigger, step, render, stats, S, get debris() { return debris; }, get speed() { return speed; }, get craft() { return craft; },
      run(seconds, { dt = 1 / 60, triggerAt = null } = {}) {
        const n = Math.round(seconds / dt);
        for (let i = 0; i < n; i++) {
          if (triggerAt != null && S.t <= triggerAt && S.t + dt > triggerAt) trigger();
          step(dt);
        }
        render(); showStats();
        return { t: S.t, debris: debris.stats(), speed: speed.stats() };
      },
      nearMiss(v = 1) { S.nearMiss = v; },
    };

    // ------------------------------------------------------------ UI
    const SCENES = ['ship', 'rocks', 'speed', 'wall', 'boom', 'wreck', 'audio'];
    const scenesEl = document.getElementById('scenes');
    for (const n of SCENES) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => setup(n); scenesEl.appendChild(b); }
    const levelsEl = document.getElementById('levels');
    for (const n of Object.keys(LEVELS)) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { S.level = n; if (flight) Object.assign(flight, LEVELS[n], { speed: 130 * LEVELS[n].speedN }); }; levelsEl.appendChild(b); }
    document.querySelector('[data-act=break]').onclick = trigger;
    document.querySelector('[data-act=near]').onclick = () => window.fx.nearMiss(1);
    document.querySelector('[data-act=reduce]').onclick = (e) => { S.reduce = !S.reduce; e.target.classList.toggle('on', S.reduce); setup(S.name); };
    document.querySelector('[data-act=audio]').onclick = () => { const a = document.getElementById('audio'); a.style.display = a.style.display === 'block' ? 'none' : 'block'; };
    window.addEventListener('keydown', (e) => {
      if (e.key === 'b' || e.key === 'B') trigger();
      else if (e.key === 'n' || e.key === 'N') window.fx.nearMiss(1);
      else if (e.key === 'a' || e.key === 'A') document.querySelector('[data-act=audio]').click();
      else if (e.key === 'h' || e.key === 'H') document.getElementById('panel').classList.toggle('hidden');
      else if (e.key === ' ') paused = !paused;
    });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
      speed?.setSize(window.innerWidth, window.innerHeight);
      if (tunnel) tunnel.pixelHeight = renderer.domElement.height;
    });

    // ------------------------------------------------------------ audio test
    const audio = new AudioEngine();
    const SOUNDS = [
      ['explosion', { size: 1, ship: true }], ['explosion', { size: 0.6 }], ['demolition', {}], ['sonicBoom', {}], ['bump', { intensity: 0.3 }], ['bump', { intensity: 1 }],
      ['passBy', { pan: -0.8, speed: 1 }], ['passBy', { pan: 0.8, speed: 1.3, kind: 'rock' }], ['nearMiss', { pan: 0.5 }], ['boostPad', {}], ['boostPad', { big: true }],
      ['dodge', { pan: -0.4 }], ['deflect', {}], ['debris', { size: 0.6 }], ['debris', { size: 0.4, kind: 'rock' }], ['shatter', { kind: 'rock', size: 0.8 }], ['laser', {}], ['boostStart', {}], ['wall', { intensity: 0.6 }],
    ];
    const soundsEl = document.getElementById('sounds');
    for (const [n, o] of SOUNDS) {
      const b = document.createElement('button');
      b.textContent = n + (Object.keys(o).length ? ' ' + Object.entries(o).map(([k, v]) => `${k}:${v}`).join(',') : '');
      b.onclick = () => { audio.unlock(); audio.play(n, o); };
      soundsEl.appendChild(b);
    }
    let engOn = false;
    document.getElementById('engOn').onclick = (e) => { audio.unlock(); engOn = !engOn; e.target.classList.toggle('on', engOn); };
    const val = (id) => +document.getElementById(id).value;
    const chk = (id) => document.getElementById(id).checked;
    setInterval(() => {
      if (!audio.ctx) return;
      const grind = val('eGrind');
      audio.setEngine({ active: engOn, speedN: val('eSpeed'), throttle: val('eThr'), boost: chk('eBoost'), supersonic: chk('eSS'), wall: val('eWall'), grind });
    }, 33);

    /** Render sounds through OfflineAudioContexts and measure peak / RMS / NaN / tail silence. */
    async function audioTest({ sr = 44100 } = {}) {
      const measure = (buf, t0 = 0, t1 = buf.duration) => {
        let peak = 0, sum = 0, n = 0, nan = 0;
        const i0 = Math.floor(t0 * sr), i1 = Math.min(buf.length, Math.floor(t1 * sr));
        for (let c = 0; c < buf.numberOfChannels; c++) {
          const d = buf.getChannelData(c);
          for (let i = i0; i < i1; i++) { const x = d[i]; if (!Number.isFinite(x)) { nan++; continue; } const ax = Math.abs(x); if (ax > peak) peak = ax; sum += x * x; n++; }
        }
        return { peak: +peak.toFixed(3), rmsDb: +(10 * Math.log10(sum / Math.max(1, n) + 1e-12)).toFixed(1), nan };
      };
      const make = (dur, bypassLimiter) => {
        const ctx = new OfflineAudioContext(2, Math.ceil(sr * dur), sr);
        const a = new AudioEngine({ context: ctx });
        a.setVolumes({ master: 1, sfx: 1, music: 1 });   // worst case: everything at full
        if (bypassLimiter) { a.compressor.disconnect(); a.compressor.connect(ctx.destination); }
        return { ctx, a };
      };
      const out = [];
      const names = [...new Set(SOUNDS.map(([n, o]) => JSON.stringify([n, o])))].map((s) => JSON.parse(s));
      for (const [n, o] of names) {
        const res = {};
        for (const bypass of [true, false]) {
          const { ctx, a } = make(4, bypass);
          let err = null;
          try { a.play(n, o); } catch (e) { err = e.message; }
          const buf = await ctx.startRendering();
          res[bypass ? 'raw' : 'lim'] = measure(buf);
          res.tail = measure(buf, 3.5, 4).peak;
          if (err) res.err = err;
        }
        out.push({ name: n + (Object.keys(o).length ? JSON.stringify(o) : ''), raw: res.raw.peak, lim: res.lim.peak, rmsDb: res.lim.rmsDb, nan: res.raw.nan + res.lim.nan, tail: res.tail, err: res.err });
      }
      // engine sweep: idle -> cruise -> boost -> supersonic+grind -> off
      const seg = [
        ['idle', { active: true, speedN: 0, throttle: 0 }], ['cruise', { active: true, speedN: 0.8, throttle: 1 }],
        ['boost', { active: true, speedN: 1.15, throttle: 1, boost: true }], ['super+grind', { active: true, speedN: 1.4, throttle: 1, boost: true, supersonic: true, wall: 1, scraping: true }],
        ['off', { active: false, speedN: 0, throttle: 0 }],
      ];
      for (const bypass of [true, false]) {
        const { ctx, a } = make(seg.length * 1.5, bypass);
        const steps = [];
        for (let i = 0; i < seg.length; i++) for (let k = 0; k < 10; k++) steps.push([i * 1.5 + k * 0.15, seg[i][1]]);
        for (const [tt, st] of steps) if (tt > 0) ctx.suspend(tt).then(() => { a.setEngine(st); ctx.resume(); });
        a.setEngine(seg[0][1]);
        const buf = await ctx.startRendering();
        seg.forEach(([name], i) => out.push({ name: 'engine:' + name + (bypass ? ' (raw)' : ''), ...measure(buf, i * 1.5 + 0.5, i * 1.5 + 1.5) }));
      }
      // worst-case stack: everything at once on top of a supersonic grinding engine
      for (const bypass of [true, false]) {
        const { ctx, a } = make(3, bypass);
        a.setEngine(seg[3][1]);
        ctx.suspend(0.5).then(() => { for (const n of ['demolition', 'sonicBoom', 'bump', 'nearMiss', 'passBy']) a.play(n, { intensity: 1, speed: 1.3, pan: 0.6 }); a.play('explosion', { size: 1, ship: true }); a.setEngine(seg[3][1]); ctx.resume(); });
        const buf = await ctx.startRendering();
        out.push({ name: 'STACK' + (bypass ? ' (raw, no limiter)' : ' (limited)'), ...measure(buf) });
      }
      return out;
    }
    window.audioTest = audioTest;
    document.getElementById('offline').onclick = async () => {
      const el = document.getElementById('atest');
      el.textContent = 'rendering…';
      const r = await audioTest();
      el.textContent = r.map((x) => `${x.name.padEnd(30).slice(0, 30)} ${x.raw != null ? `raw ${x.raw} lim ${x.lim}` : `peak ${x.peak}`} ${x.rmsDb}dB${x.nan ? ' NaN!' : ''}${x.tail > 0.001 ? ' TAIL ' + x.tail : ''}${x.err ? ' ERR ' + x.err : ''}`).join('\n');
    };

    // ------------------------------------------------------------ go
    setup(S.name);
    if (params.has('autobreak')) setTimeout(trigger, 600);
    window.__ready = true;
    if (!manual) loop(); else { render(); showStats(); }
  </script>
</body>
